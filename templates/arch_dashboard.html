{% extends "index.html" %}
{% block content %}
<h2>System Architect Dashboard</h2>
<div id="arch-metrics">
  <h3>System Health & Architecture</h3>
  <div class="row">
    <div class="col"><h4>Active Users</h4><span id="active-users">...</span></div>
    <div class="col"><h4>API Calls</h4><span id="api-calls">...</span></div>
    <div class="col"><h4>Errors</h4><span id="errors">...</span></div>
    <div class="col"><h4>Uptime</h4><span id="uptime">...</span></div>
  </div>
  <canvas id="archChart" width="800" height="300"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function fetchArchMetrics() {
  fetch('/api/arch_dashboard_metrics').then(r => r.json()).then(data => {
    document.getElementById('active-users').textContent = data.active_users;
    document.getElementById('api-calls').textContent = data.api_calls;
    document.getElementById('errors').textContent = data.errors;
    document.getElementById('uptime').textContent = data.uptime;
    renderChart(data.chart_labels, data.chart_values);
  });
}
function renderChart(labels, values) {
  new Chart(document.getElementById('archChart'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'System Health', data: values }] },
    options: { responsive: true }
  });
}
fetchArchMetrics();
setInterval(fetchArchMetrics, 10000);
</script>
{% endblock %}

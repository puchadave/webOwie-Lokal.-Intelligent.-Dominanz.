<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Products</title>
  <link rel="stylesheet" href="/static/dummy.css">
  </head>
<body>
  <h1>Available Services</h1>
  <ul>
    {% for p in products %}
      <li><a href="/ecommerce/{{ p.id }}">{{ p.name }}</a> — {{ "%.2f"|format(p.price) }} EUR</li>
    {% else %}
      <li>No products</li>
    {% endfor %}
  </ul>
  <p><a href="/">Back</a></p>
</body>
</html>

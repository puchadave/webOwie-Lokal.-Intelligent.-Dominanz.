<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create Post</title>
  <link rel="stylesheet" href="/static/dummy.css">
</head>
<body>
  <h1>Create Post</h1>
  <form method="post" action="/blog/create">
    <div>
      <label>Title: <input type="text" name="title"></label>
    </div>
    <div>
      <label>Slug: <input type="text" name="slug"></label>
    </div>
    <div>
      <label>Content:</label><br>
      <textarea name="content" rows="10" cols="60"></textarea>
    </div>
    <div>
      <label>Vlog: <input type="checkbox" name="is_vlog" value="1"></label>
    </div>
    <div>
      <label>Video URL: <input type="text" name="video_url"></label>
    </div>
    <div>
      <label>Publish now: <input type="checkbox" name="publish" value="1"></label>
    </div>
    <div>
      <button type="submit">Create</button>
    </div>
  </form>
  <p><a href="/blog/admin">Back</a></p>
</body>
</html>

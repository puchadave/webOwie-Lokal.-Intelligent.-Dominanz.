<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <link rel="stylesheet" href="/static/dummy.css">
</head>
<body>
  <h1>Register</h1>
  {% if not open_registration %}
    <p>Registrations are currently disabled. Please contact the site administrator.</p>
  {% else %}
  <form method="post" action="/auth/register">
    <label>Username<br><input name="username" required></label><br>
    <label>Email (optional)<br><input name="email" type="email"></label><br>
    <label>Password<br><input type="password" name="password" required></label><br>
    <hr>
    <label><input type="checkbox" name="setup_kasse" value="1"> Setup Kasse (payment account) during registration</label><br>
    <label>Kasse provider<br>
      <select name="kasse_provider">
        <option value="paypal">PayPal</option>
        <option value="sumup">SumUp</option>
        <option value="revolut">Revolut</option>
        <option value="bank">Bank (Online-Banking)</option>
      </select>
    </label><br>
    <label>Account identifier (provider-specific)<br><input name="kasse_account"></label><br>
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/auth/login">Login</a></p>
  {% endif %}
</body>
</html>

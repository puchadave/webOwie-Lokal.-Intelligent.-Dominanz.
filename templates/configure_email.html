<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Email</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .branding { display: flex; align-items: center; margin-bottom: 12px; }
        .site-logo { height: 48px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"], input[type="email"], input[type="number"] {
            width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd;
        }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .warning { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="branding">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo" class="site-logo">
    </div>
    <div class="container">
        <h1>Configure Email Account</h1>
        <p class="warning">
            WARNING: Storing your email password directly in configuration files or session is INSECURE for production environments.
            This is for demonstration purposes only.
        </p>
        <form action="{{ url_for('configure_email') }}" method="post">
            <label for="email_address">Email Address:</label>
            <input type="email" id="email_address" name="email_address" value="{{ config.email_address if config else '' }}" required>

            <label for="email_password">Email Password:</label>
            <input type="password" id="email_password" name="email_password" value="{{ config.email_password if config else '' }}" required>

            <h2>IMAP Settings (Incoming Mail)</h2>
            <label for="imap_server">IMAP Server:</label>
            <input type="text" id="imap_server" name="imap_server" value="{{ config.imap_server if config else '' }}" required>

            <label for="imap_port">IMAP Port (e.g., 993 for SSL):</label>
            <input type="number" id="imap_port" name="imap_port" value="{{ config.imap_port if config else '993' }}" required>

            <h2>SMTP Settings (Outgoing Mail)</h2>
            <label for="smtp_server">SMTP Server:</label>
            <input type="text" id="smtp_server" name="smtp_server" value="{{ config.smtp_server if config else '' }}" required>

            <label for="smtp_port">SMTP Port (e.g., 587 for TLS, 465 for SSL):</label>
            <input type="number" id="smtp_port" name="smtp_port" value="{{ config.smtp_port if config else '587' }}" required>

            <button type="submit">Save Configuration</button>
        </form>
    </div>
</body>
</html>

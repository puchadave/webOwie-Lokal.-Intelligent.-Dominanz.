{% extends "index.html" %}
{% block content %}
<h2>Cybersecurity Dashboard</h2>
<div id="cyber-metrics">
  <h3>Security KPIs</h3>
  <div class="row">
    <div class="col"><h4>Threats Detected</h4><span id="threats">...</span></div>
    <div class="col"><h4>Incidents</h4><span id="incidents">...</span></div>
    <div class="col"><h4>Patches Applied</h4><span id="patches">...</span></div>
    <div class="col"><h4>Vulnerabilities</h4><span id="vulns">...</span></div>
  </div>
  <canvas id="cyberChart" width="800" height="300"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function fetchCyberMetrics() {
  fetch('/api/cyber_dashboard_metrics').then(r => r.json()).then(data => {
    document.getElementById('threats').textContent = data.threats;
    document.getElementById('incidents').textContent = data.incidents;
    document.getElementById('patches').textContent = data.patches;
    document.getElementById('vulns').textContent = data.vulnerabilities;
    renderChart(data.chart_labels, data.chart_values);
  });
}
function renderChart(labels, values) {
  new Chart(document.getElementById('cyberChart'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'Security KPIs', data: values }] },
    options: { responsive: true }
  });
}
fetchCyberMetrics();
setInterval(fetchCyberMetrics, 10000);
</script>
{% endblock %}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blog Admin</title>
  <link rel="stylesheet" href="/static/dummy.css">
</head>
<body>
  <h1>Blog Admin</h1>
  <p><a href="/blog/create">Create new post</a></p>
  <ul>
    {% for p in posts %}
      <li>{{ p.title }} - Published: {{ p.is_published }} - <a href="/blog/{{ p.slug }}">View</a></li>
    {% else %}
      <li>No posts</li>
    {% endfor %}
  </ul>
  <p><a href="/">Back</a></p>
</body>
</html>
